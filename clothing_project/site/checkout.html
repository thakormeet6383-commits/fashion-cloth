<!DOCTYPE html><html><head><title>Checkout</title><link rel='stylesheet' href='styles.css'></head>
<style>
    /* CHECKOUT PAGE CONTAINER */
.form-box {
    width: 90%;
    max-width: 450px;
    margin: 30px auto;
    background: #fff;
    padding: 25px 30px;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    gap: 15px;
    animation: fadeIn 0.4s ease;
}

/* HEADINGS */
.form-box h3 {
    margin-top: 10px;
    margin-bottom: 5px;
    font-size: 18px;
    font-weight: 700;
    color: #111;
}

/* INPUT FIELDS */
.form-box input,
.form-box select {
    padding: 12px 15px;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    background: #fafafa;
    font-size: 15px;
    transition: 0.25s;
    outline: none;
}

/* Focus Effect */
.form-box input:focus,
.form-box select:focus {
    border-color: #000;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
}

/* SUBMIT BUTTON */
.form-box button {
    margin-top: 10px;
    padding: 12px 0;
    border: none;
    border-radius: 12px;
    background: #000;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.25s ease;
}

/* Hover Button */
.form-box button:hover {
    background: #222;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.2);
}

/* Fade Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>


<body><div id='navbar'></div><h2 class='page-title'>Checkout</h2>
<form id='checkoutForm' class='form-box'>
<h3>Shipping Address</h3><input placeholder='Full Name' required><input placeholder='Address' required>
<input placeholder='City' required><input placeholder='Pincode' required>
<h3>Payment Method</h3><select required><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select>
<button type='submit'>Place Order</button></form>
<script src='script.js'></script><script src="float-window.js"></script></body></html>
